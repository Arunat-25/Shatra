# Render Blueprint для бесплатного хостинга Shatra.
# Развернуть: Render → New → Blueprint → выбрать репозиторий.
# Секреты (DATABASE_URL, REDIS_URL) вводятся вручную при создании —
# см. docs/DEPLOY_RENDER.md.
services:
  - type: web
    name: shatra
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: AI_ENGINE
        # Встроенный Python-поиск: Rust-микросервис на бесплатном тарифе не поднимается.
        value: python
      - key: DATABASE_URL
        sync: false # postgresql+asyncpg://...sslmode=require (Neon)
      - key: REDIS_URL
        sync: false # rediss://... (Upstash)
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOW_ORIGINS
        sync: false # https://<имя-сервиса>.onrender.com
      - key: METRICS_TOKEN
        sync: false # опционально
      - key: SENTRY_DSN
        sync: false # опционально
      - key: VITE_SENTRY_DSN
        sync: false # опционально, попадает в сборку фронтенда
      - key: LOG_FORMAT
        value: json
